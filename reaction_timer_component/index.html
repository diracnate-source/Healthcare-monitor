<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, "Malgun Gothic", sans-serif;
  }
  #box {
    text-align: center;
    padding: 60px 20px;
    border-radius: 12px;
    font-size: 20px;
    color: white;
    background-color: #333;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.05s;
  }
  #box.waiting { background-color: #333; }
  #box.go { background-color: #2ecc71; font-weight: bold; font-size: 24px; }
  #box.early { background-color: #e74c3c; }
  #box.done { background-color: #555; }
</style>
</head>
<body>
<div id="box" class="waiting">🕒 준비하세요...</div>

<script>
  // ============================================================
  // Streamlit 커스텀 컴포넌트 저수준 프로토콜을 직접 구현.
  // (streamlit-component-lib npm 패키지는 웹팩/React 빌드 전용이라
  // CDN <script> 태그로 그대로 불러와지지 않기 때문에, 외부 라이브러리
  // 없이 Streamlit이 내부적으로 쓰는 postMessage 규약을 직접 구현했다.)
  // ============================================================

  function sendMessageToStreamlit(type, extra) {
    window.parent.postMessage(
      Object.assign({ isStreamlitMessage: true, type: type }, extra || {}),
      "*"
    );
  }

  function setComponentValue(value) {
    sendMessageToStreamlit("streamlit:setComponentValue", {
      value: value,
      dataType: "json",
    });
  }

  function setFrameHeight(height) {
    sendMessageToStreamlit("streamlit:setFrameHeight", { height: height });
  }

  function componentReady() {
    sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  }

  // 이 아래는 전부 사용자 브라우저 안에서 실행된다. 자극이 화면에
  // 실제로 그려진 시점(stimulusTime)과 클릭한 시점을 전부
  // performance.now()로 브라우저 안에서만 측정하기 때문에, 서버
  // 왕복(네트워크 지연)이 값에 섞이지 않는다. 서버로는 계산이 끝난
  // 반응속도(ms) 숫자 하나만 전달한다.

  let timerStarted = false;
  let stimulusTime = null;
  let settled = false;

  const box = document.getElementById("box");

  window.addEventListener("message", (event) => {
    const data = event.data;
    if (!data || data.type !== "streamlit:render") return;

    const args = data.args || {};
    const targetDelayMs = args.target_delay_ms;

    if (!timerStarted) {
      timerStarted = true;
      box.className = "waiting";
      box.innerHTML = "🕒 준비하세요...";

      setTimeout(() => {
        if (settled) return; // 이미 너무 일찍 클릭해서 라운드가 끝난 경우
        stimulusTime = performance.now();
        box.className = "go";
        box.innerHTML = "🟢 지금 클릭하세요!";
      }, targetDelayMs);
    }

    setFrameHeight(220);
  });

  box.addEventListener("click", () => {
    if (settled) return;

    if (stimulusTime === null) {
      // 초록불 뜨기 전에 클릭 — 너무 이른 클릭(false start)
      settled = true;
      box.className = "early";
      box.innerHTML = "⚠️ 너무 빨리 눌렀어요! 다시 준비합니다...";
      setComponentValue({ status: "early", reaction_ms: null });
      return;
    }

    settled = true;
    const reactionMs = performance.now() - stimulusTime;
    box.className = "done";
    box.innerHTML = "✅ 완료: " + reactionMs.toFixed(0) + "ms";
    setComponentValue({ status: "ok", reaction_ms: reactionMs });
  });

  setFrameHeight(220);
  componentReady();
</script>
</body>
</html>
