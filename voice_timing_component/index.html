<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin:0; padding:0; font-family:-apple-system,"Malgun Gothic","Noto Sans KR",sans-serif; }
  #box { border-radius:10px; background:#F5F6F2; color:#1B2B2E; padding:10px 14px; font-size:14px; line-height:1.4; border:1px solid #DDE2DC; }
  #bar { height:8px; background:#DDE2DC; border-radius:4px; margin-top:6px; overflow:hidden; }
  #lvl { height:100%; width:0%; background:#1F7A7A; transition:width .05s; }
</style>
</head>
<body>
<div id="box"><div id="msg">🎤 마이크 준비 중…</div><div id="bar"><div id="lvl"></div></div></div>
<script>
  function send(type, extra){ window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type}, extra||{}), "*"); }
  function setComponentValue(v){ send("streamlit:setComponentValue", {value:v, dataType:"json"}); }
  function setFrameHeight(h){ send("streamlit:setFrameHeight", {height:h}); }
  function componentReady(){ send("streamlit:componentReady", {apiVersion:1}); }

  const msg = document.getElementById("msg");
  const lvl = document.getElementById("lvl");
  let started = false;

  const FRAME_MS = 20;            // 50 Hz
  const MIN_SEG_MS = 120;         // 이보다 짧은 소리는 잡음으로 본다
  const MERGE_GAP_MS = 200;       // 이보다 짧은 쉼은 한 구간으로 합친다
  const MARGIN_DB = 10;           // 소음 바닥 위 이만큼 커야 '말'로 본다
  const ABS_MIN_DB = -55;         // 절대 하한

  const pct = (arr, p) => { const s=[...arr].sort((a,b)=>a-b); return s[Math.min(s.length-1, Math.max(0, Math.floor(p*(s.length-1))))]; };
  const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const sd = a => { if(a.length<2) return null; const m=mean(a); return Math.sqrt(a.reduce((x,y)=>x+(y-m)*(y-m),0)/(a.length-1)); };
  const r1 = v => v===null||v===undefined ? null : Math.round(v*10)/10;

  function analyze(db){
    // db: 50Hz 소리 크기(dBFS) 시계열
    const floor = pct(db, 0.2);                       // 하위 20% = 소음 바닥
    const thr = Math.max(floor + MARGIN_DB, ABS_MIN_DB);
    const active = db.map(v => v > thr);
    let segs = [];
    let i = 0;
    while(i < active.length){
      if(active[i]){
        let j = i; while(j < active.length && active[j]) j++;
        segs.push([i*FRAME_MS, j*FRAME_MS]); i = j;
      } else i++;
    }
    // 짧은 쉼 합치기
    const merged = [];
    for(const s of segs){
      if(merged.length && s[0] - merged[merged.length-1][1] < MERGE_GAP_MS) merged[merged.length-1][1] = s[1];
      else merged.push([s[0], s[1]]);
    }
    const kept = merged.filter(s => s[1]-s[0] >= MIN_SEG_MS);
    const total = db.length * FRAME_MS;
    const speechMs = kept.reduce((a,s)=>a+(s[1]-s[0]),0);
    const gaps = [];
    for(let k=1;k<kept.length;k++) gaps.push(kept[k][0]-kept[k-1][1]);
    const speechDb = [];
    for(const s of kept){ for(let f=Math.floor(s[0]/FRAME_MS); f<Math.floor(s[1]/FRAME_MS); f++) speechDb.push(db[f]); }
    const snr = speechDb.length ? mean(speechDb) - floor : null;
    let quality = "ok";
    if(speechMs < 1000) quality = "no_speech";
    else if(snr !== null && snr < 8) quality = "noisy";
    return {
      noise_floor_db: r1(floor), threshold_db: r1(thr),
      segments: kept.map(s => ({start_ms: s[0], end_ms: s[1]})),
      features: {
        n_segments: kept.length,
        first_onset_ms: kept.length ? kept[0][0] : null,
        speech_time_s: r1(speechMs/1000),
        speech_ratio: Math.round(speechMs/total*1000)/1000,
        mean_segment_ms: kept.length ? Math.round(speechMs/kept.length) : null,
        mean_pause_ms: gaps.length ? Math.round(mean(gaps)) : null,
        max_pause_ms: gaps.length ? Math.max(...gaps) : null,
        n_pauses_over_1s: gaps.filter(g => g >= 1000).length,
        level_db_mean: r1(mean(speechDb)), level_db_sd: r1(sd(speechDb)),
        snr_db: r1(snr)
      },
      quality
    };
  }

  async function run(durationS){
    let stream;
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        setComponentValue({status:"unavailable", error:"no mediaDevices"}); msg.textContent="🎤 이 환경에서는 마이크를 쓸 수 없어요."; return;
      }
      stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}, video:false});
    }catch(e){
      const denied = e && (e.name==="NotAllowedError" || e.name==="SecurityError");
      setComponentValue({status: denied ? "denied" : "unavailable", error: String(e && e.name || e)});
      msg.textContent = "🎤 마이크를 사용할 수 없어요. 음성 기록 없이 진행합니다.";
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    if(ctx.state === "suspended"){ try{ await ctx.resume(); }catch(_){} }
    const src = ctx.createMediaStreamSource(stream);
    const an = ctx.createAnalyser(); an.fftSize = 1024;
    src.connect(an);
    const buf = new Float32Array(an.fftSize);
    const db = [];
    const t0 = performance.now();
    const startEpoch = performance.timeOrigin + t0;
    msg.textContent = "🎤 소리 크기를 수신 중입니다 (녹음하지 않아요)";
    let nextTick = t0;
    await new Promise(resolve => {
      const timer = setInterval(() => {
        const now = performance.now();
        an.getFloatTimeDomainData(buf);
        let s = 0; for(let i=0;i<buf.length;i++) s += buf[i]*buf[i];
        const rms = Math.sqrt(s/buf.length);
        const d = 20*Math.log10(rms + 1e-8);
        // 20ms 격자에 맞춰 채움 (타이머 지연 보정)
        while(nextTick <= now && db.length*FRAME_MS < durationS*1000){ db.push(Math.max(-100, d)); nextTick += FRAME_MS; }
        lvl.style.width = Math.max(0, Math.min(100, (d+70)*100/60)) + "%";
        if(now - t0 >= durationS*1000){ clearInterval(timer); resolve(); }
      }, 10);
    });
    stream.getTracks().forEach(t => t.stop());
    try{ await ctx.close(); }catch(_){}
    const out = analyze(db);
    out.status = "ok";
    out.start_epoch_ms = Math.round(startEpoch);
    out.end_epoch_ms = Math.round(performance.timeOrigin + performance.now());
    out.duration_s = durationS;
    out.level_db_50hz = db.map(v => Math.round(v));
    out.note = "audio is not recorded; only loudness envelope; research prototype";
    msg.textContent = "🎤 음성 시간 정보 기록 완료 (소리 원본은 저장하지 않아요)";
    setComponentValue(out);
  }

  window.addEventListener("message", (event) => {
    const data = event.data;
    if(!data || data.type !== "streamlit:render") return;
    if(!started){ started = true; run((data.args && data.args.duration_s) ? Number(data.args.duration_s) : 16); }
    setFrameHeight(70);
  });
  setFrameHeight(70);
  componentReady();
</script>
</body>
</html>
